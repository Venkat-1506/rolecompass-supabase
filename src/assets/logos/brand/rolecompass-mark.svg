<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="rc-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rc-needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#rc-mark-grad)" />
  <!-- Compass Dial Circle -->
  <circle cx="50" cy="50" r="32" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-dasharray="2 4" />
  <!-- Cardinal Tick Marks -->
  <line x1="50" y1="22" x2="50" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="74" x2="50" y2="78" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <line x1="22" y1="50" x2="26" y2="50" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <line x1="74" y1="50" x2="78" y2="50" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  <!-- Compass Needle - North (White) -->
  <polygon points="50,26 43,50 50,46" fill="url(#rc-needle-grad)" />
  <polygon points="50,26 57,50 50,46" fill="#ffffff" />
  <!-- Compass Needle - South (Subtle Light Blue) -->
  <polygon points="50,74 43,50 50,54" fill="rgba(255,255,255,0.6)" />
  <polygon points="50,74 57,50 50,54" fill="rgba(255,255,255,0.8)" />
  <!-- Center Pivot Pin -->
  <circle cx="50" cy="50" r="4" fill="#059669" stroke="#ffffff" stroke-width="2" />
</svg>
