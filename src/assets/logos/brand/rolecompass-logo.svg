<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="rc-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Brand Mark Icon Emblem -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#rc-logo-grad)" />
    <circle cx="30" cy="30" r="19" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-dasharray="2 3" />
    <polygon points="30,16 25,30 30,27" fill="#ffffff" />
    <polygon points="30,16 35,30 30,27" fill="#e2e8f0" />
    <polygon points="30,44 25,30 30,33" fill="rgba(255,255,255,0.6)" />
    <polygon points="30,44 35,30 30,33" fill="rgba(255,255,255,0.8)" />
    <circle cx="30" cy="30" r="3" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
  </g>
  <!-- Brand Text Typography -->
  <text x="85" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Role<tspan fill="#059669">Compass</tspan></text>
  <text x="86" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="2">CAREER NAVIGATION PLATFORM</text>
</svg>
