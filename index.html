<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RoleCompass - Candidate Career Navigation and Job Discovery Demo for Students, Freshers, and Experienced Professionals."
    />
    <title>RoleCompass — Career Navigation & Job Discovery Platform</title>
  </head>
  <body>
    <script>
      window.addEventListener('error', function (e) {
        console.error('GLOBAL WINDOW ERROR:', e);
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          var box = document.createElement('div');
          box.id = 'rc-error-diagnostic';
          box.style.cssText =
            'position:fixed;top:20px;left:20px;right:20px;background:#1e293b;color:#f87171;padding:24px;border-radius:12px;font-family:sans-serif;z-index:999999;box-shadow:0 10px 30px rgba(0,0,0,0.5);border:1px solid #ef4444;max-width:700px;margin:auto;';
          box.innerHTML =
            '<h3 style="margin:0 0 10px 0;color:#fff;font-size:18px;">RoleCompass Load Diagnostic</h3>' +
            '<p style="color:#cbd5e1;margin:0 0 10px 0;font-size:14px;">Error: ' +
            (e.message || 'Script error') +
            '</p>' +
            '<pre style="background:#0f172a;padding:12px;border-radius:8px;overflow:auto;font-size:12px;color:#fca5a5;max-height:200px;">' +
            (e.error ? e.error.stack : e.filename + ':' + e.lineno) +
            '</pre>' +
            '<button onclick="try{var p=\'rolecompass_\';Object.keys(localStorage).filter(function(k){return k.indexOf(p)===0}).forEach(function(k){localStorage.removeItem(k)});Object.keys(sessionStorage).filter(function(k){return k.indexOf(p)===0}).forEach(function(k){sessionStorage.removeItem(k)});}catch(err){}window.location.reload();" style="margin-top:12px;background:#ef4444;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;">Reset RoleCompass Data & Reload</button>';
          document.body.appendChild(box);
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
